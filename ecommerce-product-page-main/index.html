<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  
  <title>Frontend Mentor | E-commerce product page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="header">
    <div class="logo">sneakers</div>
    <nav class="nav">
       <a href="#">Collections</a>
       <a href="#">Men</a>
       <a href="#">Women</a>
       <a href="#">About</a>
       <a href="#">Contact</a>
    </nav>
    <div class="header-right">
      <img src="images/icon-cart.svg" alt="cart" class="cart-icon">
      <img src="images/image-avatar.png" alt="low-profile">
    </div>
  </header>
  <div class="container">
    <div class="left">
      <img src="images/image-product-1.jpg" alt="sneaker">
      <div class="thumbnails">
        <img src="images/image-product-1-thumbnail.jpg" alt="sneaker 1">
        <img src="images/image-product-2-thumbnail.jpg" alt="sneaker 2">
        <img src="images/image-product-3-thumbnail.jpg" alt="sneaker 3">
        <img src="images/image-product-4-thumbnail.jpg" alt="sneaker 4">
      </div>
    </div>
    <div class="right">
      <h3>Sneaker Company</h3>
      <h1>Fall Limited Edition Sneakers</h1>
      <p>These low-profile sneakers are your perfect casual wear companion. Featuring a 
      durable rubber outer sole, they’ll withstand everything the weather can offer.</p>

      <div class="price">
        <h2> $125.00</h2>
        <span class="discount"> 50%</span>
      </div>
      <p class="old-price"> $250.00</p>
      <div class="cart-section">
        <div class="quantity">
          <button>-</button>
          <span>0</span>
          <button>+</button>
        </div>
        <button class="cart-btn">
          <img src="images/icon-cart.svg" alt=""> Add to cart
        </button>
      </div>
    </div>
  </div>

</body>
</html>
